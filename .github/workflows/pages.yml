name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Set up Java for Firestore security tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install validation dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix worker --no-audit --no-fund
      - name: Validate application and account isolation
        run: |
          node --check app.js
          node --check library.js
          node --check cloud-state.js
          node --check firebase-app.mjs
          node --check youtube-api.js
          node --check worker/src/index.js
          node --check worker/src/youtube.js
          npm run check --prefix worker
          npm test
          npm run test:rules
      - name: Prepare static files
        run: |
          mkdir _site
          cp index.html styles.css app.js cloud-state.js firebase-app.mjs youtube-api.js library.js favicon.svg .nojekyll _site/
          cp -R data _site/data
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
